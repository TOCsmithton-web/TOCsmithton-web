:root{--ink:#193f39;--deep:#123d36;--olive:#768b6f;--paper:#f8f9f5;--cream:#f1f3eb;--border:#dce3d7;--muted:#60766b;--white:#fff;--amber:#9f5d09;--red:#a73d34;--green:#237349;--blue:#37647b;--shadow:0 14px 42px rgba(18,61,54,.07)}

<style id="toc-ocean-theme">

/* ── TOC Ocean identity · Uses the user's official Tasmanian Oyster Co. logo ── */
:root {
  --ink:#0b3045; --deep:#082e4d; --olive:#0b8099;
  --paper:#edf8fa; --cream:#e5f6f8; --border:#d0e4ea;
  --muted:#547484; --white:#fff; --amber:#95733b;
  --red:#ad453f; --green:#147566; --blue:#176da0;
  --shadow:0 18px 42px rgba(6,58,81,.09);
  --ocean:#075477; --sea:#007c96; --aqua:#7eced1; --foam:#dbf6f4;
}
body {
  color:var(--ink);
  background:
    radial-gradient(ellipse 650px 400px at 90% 3%, rgba(119,210,221,.21), transparent 75%),
    radial-gradient(ellipse 560px 330px at 0% 54%, rgba(74,170,205,.13), transparent 80%),
    linear-gradient(180deg,#f6fbfc 0%,#edf8fa 43%,#eaf5f8 100%);
  min-height:100vh;
}
.top-strip {height:8px;background:linear-gradient(90deg,#032a44 0%,#08718d 50%,#87d9d6 100%)}
.shell {max-width:1180px;padding-top:17px}
.header {
  border:1px solid #103e59;
  background:linear-gradient(112deg,#08283f 0%,#0a4667 62%,#09647d 100%);
  padding:14px 22px;border-radius:18px;
  box-shadow:0 12px 30px rgba(6,49,74,.15);
  position:relative;overflow:hidden;
}
.header::after {content:"";position:absolute;right:-40px;bottom:-100px;width:360px;height:160px;
  border-radius:50%;border:24px solid rgba(128,215,215,.08);pointer-events:none}
.brand{position:relative;z-index:1;gap:16px;min-width:0}
.brand-logo {width:76px;height:76px;flex:0 0 76px;object-fit:contain;background:#000;
  border-radius:14px;border:1px solid rgba(206,229,228,.65);box-shadow:0 4px 16px #051d2a55}
.brand-copy{min-width:0}.brand-caption{color:#9de1df;font-size:11px;letter-spacing:.19em}
.brand-title{font-weight:850;letter-spacing:.035em;font-size:20px;color:#fff;line-height:1.24;margin-top:2px}
.brand-subtitle{color:#b3dfe7;font-size:12px;margin-top:5px}
.header-actions{position:relative;z-index:1}.header-email{color:#d6ecf3}
.header .button.alt{background:rgba(255,255,255,.98);border-color:transparent;color:#164563}
.header .pill.amber{background:#e9dfc1;color:#5b4521;letter-spacing:.035em;font-size:10px;padding:7px 12px}
.preview-banner{background:#f8f0da;border:1px solid #e5d7ae;color:#5b502e;border-radius:11px;margin:16px 0 22px}
.preview-banner strong{color:#6c4f1c}
.eyebrow {color:#087e9d;font-size:11px;letter-spacing:.18em}
.pill {background:#e1f3f6;color:#065470}
.pill.blue {background:#dff4f9;color:#115b7a}
.pill.amber{background:#faf0dc;color:#795a1e}
.button {background:linear-gradient(110deg,#0b5077,#087b92);border-color:#0b5576;
  border-radius:9px;box-shadow:0 4px 9px rgba(7,81,115,.1)}
.button:hover {filter:brightness(1.1)}
.button.alt{background:#fff;color:#115678;border-color:#b0cfdc;box-shadow:none}
.button.soft{background:#e0f4f8;color:#0d5473;border-color:#cfebf2}
.button.danger{background:#fff;color:var(--red);border-color:#e6b6b0}
.button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid #4fbfcc;outline-offset:2px}
.sidebar,.card,.metric,.order-card{border-color:var(--border);box-shadow:var(--shadow)}
.card {border-radius:16px}.sidebar{border-radius:15px;border-top:5px solid #087e99}
.nav button {color:#426c7e}.nav button.active{background:#dbf2f6;color:#085774;border-left:3px solid #0b84a1}
.nav button:hover{background:#e9f6f9}
.field label,.field .label{color:#265469}
.field input,.field select,.field textarea{border-color:#bdd6df;color:#123c55;background:#fbfeff}
.main h1,.section-title,.total,.metric .number{color:#0a3e5a}
.lead,.muted,.hint,.footnote,.footer,.side-note{color:#587b8d}
th{background:#e6f4f8;color:#39677a}
.empty{border-color:#bddce6}
.summary-box{background:linear-gradient(120deg,#e0f4f9,#f0fcfc);border-color:#c1e7ec}
.checkrow input{accent-color:#047f95}
.notice{background:#e7f5f7;border-left:4px solid #16a0a9;color:#285a67}
.guide{color:#456b7a}.auth-line{border-color:#eadbae}
.toast{background:#07384f;box-shadow:0 15px 35px #07384f35}
.modal-backdrop{background:#041d32b6}
.footer{border-color:#c7e2e9}
/* Landing hero with broad coastal colours and wave motifs */
.ocean-hero {
  position:relative;isolation:isolate;text-align:center;overflow:hidden;
  min-height:335px;border-radius:22px;
  background:
    radial-gradient(circle at 82% 18%,rgba(118,213,214,.32),transparent 36%),
    radial-gradient(circle at 18% 108%,rgba(8,185,193,.20),transparent 35%),
    linear-gradient(118deg,#06283f 2%,#07537b 50%,#0c8094 100%);
  padding:45px 20px 108px;
  border:1px solid rgba(8,92,122,.5);
  box-shadow:0 14px 44px #074a6b20;
}
.ocean-hero-content{position:relative;z-index:3}
.ocean-hero .eyebrow{color:#9ae3e5;letter-spacing:.24em}
.ocean-hero h1{font-size:clamp(32px,4.7vw,50px);line-height:1.1;letter-spacing:-.045em;
  margin:14px 0 10px;color:#fff;font-weight:850}
.farm-names{color:#d1edf1;font-size:15px;font-weight:600;letter-spacing:.045em}
.farm-names span{color:#7cd6d7;margin:0 7px}
.hero-motto {font:italic 27px/1.25 Georgia,'Times New Roman',serif;color:#d8f9f8;margin:18px 0 23px}
.price-highlight{display:inline-flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:center;
  background:rgba(5,36,56,.63);border:1px solid rgba(153,223,226,.43);border-radius:99px;
  padding:9px 18px;color:#e9ffff;box-shadow:0 6px 25px #05253729}
.price-highlight span{font-size:11px;letter-spacing:.1em;font-weight:850;color:#b3e9e9}
.price-highlight strong{font-size:28px;line-height:1;color:#fff}
.price-highlight small{font-size:11px;letter-spacing:.08em;color:#c1e6ee}
.hero-wave{position:absolute;left:-12%;width:124%;height:140px;border-radius:50%;pointer-events:none}
.wave-one{background:rgba(88,191,207,.21);bottom:-96px;transform:rotate(-5deg);z-index:2}
.wave-two{background:rgba(207,248,247,.18);bottom:-119px;transform:rotate(4deg);z-index:1}
.login-wrap{max-width:640px;margin:-77px auto 76px;position:relative;z-index:3}
.login-card{padding:30px 35px;background:rgba(255,255,255,.99);border-color:#cae6ea;
  box-shadow:0 22px 62px rgba(4,50,70,.18)}
.login-card .section-title{font-size:23px;margin:8px 0!important}
.login-options{margin-top:20px}
.login-provider{min-height:55px;border-radius:10px;border:1px solid #c3dbe3;
  font-size:15px;transition:transform .12s ease,background .12s ease}
.login-provider:hover{transform:translateY(-1px)}
.google-provider{background:linear-gradient(105deg,#07516e,#087b8e);color:#fff;border-color:#126982}
.google-provider:hover{background:linear-gradient(105deg,#066281,#078fa2)}
.google-provider svg{background:#fff;border-radius:50%;padding:3px;width:25px;height:25px}
.microsoft-provider{background:#fff;color:#144c67}
.microsoft-provider:hover{background:#edf9fb}
.google-provider .label-chip{color:#0c5971;background:#d5f1f4}
.login-card .rule{border-top-color:#d8e9ee}
.label-chip{background:#edf3f5;color:#53758a}
@media(max-width:850px){.header{padding:12px 16px}.brand-logo{width:62px;height:62px;flex-basis:62px}
  .ocean-hero{padding-top:43px}.login-wrap{margin-top:-72px}}
@media(max-width:550px){.shell{padding:12px 12px 45px}.header{gap:13px;border-radius:14px}
  .brand{gap:11px}.brand-logo{width:57px;height:57px;flex-basis:57px;border-radius:9px}
  .brand-title{font-size:14px}.brand-caption{font-size:9px}.brand-subtitle{font-size:10px}
  .header-actions{width:100%;justify-content:space-between}.header .pill.amber{font-size:9px}
  .ocean-hero{margin-top:0;min-height:300px;padding:36px 13px 100px;border-radius:15px}
  .ocean-hero h1{font-size:31px}.farm-names{font-size:12px}
  .hero-motto{font-size:24px}.price-highlight{gap:7px;padding:9px 10px}
  .price-highlight span,.price-highlight small{font-size:10px}
  .price-highlight strong{font-size:24px}.login-wrap{margin:-65px 10px 55px}
  .login-card{padding:22px 17px}.login-provider{font-size:13px}.login-card .section-title{font-size:21px}
  .price-highlight span{max-width:100px}
}
@media print{.header{background:#0b4462!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ocean-hero{display:none}.login-wrap{margin:0 auto}.brand-title{color:#fff!important}}

</style>
</head>

function toast(s){let t=el('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),4500)}
function header(){return `<header class="header"><div class="brand"><img class="brand-logo" src="${TOC_LOGO}" alt="Tasmanian Oyster Co. official logo"/><div class="brand-copy"><div class="brand-caption">TASMANIAN OYSTER CO.</div><div class="brand-title">STAFF OYSTER ORDERS</div><div class="brand-subtitle">Smithton · Pittwater · Boomer Bay</div></div></div><div class="header-actions"><span class="pill amber">PROOFREADING PREVIEW</span>${state.profile?`<span class="muted header-email">${esc(state.profile.email)}</span><button class="button alt small" data-action="logout">Sign out</button>`:''}</div></header>`}
function demoNotice(){return `<div class="preview-banner"><strong>DEMO ONLY</strong><span>Google/Microsoft sign-in is simulated. Orders, approvals and payroll changes are stored <strong>only in this browser</strong>. No email is sent, no real order is placed and no wages are deducted. Buffet size is set at $6 per dozen. Terms and payroll arrangements still require TOC approval.</span></div>`}
function login(){return `${header()}${demoNotice()}<section class="ocean-hero"><div class="ocean-hero-content"><div class="eyebrow">TOC STAFF PORTAL</div><h1>Staff oyster orders</h1><div class="farm-names">Smithton <span>·</span> Pittwater <span>·</span> Boomer Bay</div><p class="hero-motto">Scan. Order. Collect.</p><div class="price-highlight"><span>BUFFET SIZE OYSTERS</span><strong>$6</strong><small>PER DOZEN · ALL FARMS</small></div></div><div class="hero-wave wave-one" aria-hidden="true"></div><div class="hero-wave wave-two" aria-hidden="true"></div></section><div class="login-wrap"><div class="card login-card"><div class="eyebrow">STAFF ACCESS</div><h2 class="section-title">Sign in to order oysters</h2><p class="muted">Staff will sign in with an approved Google account when the live system is connected.</p><div class="login-options"><button class="login-provider google-provider" data-action="login-staff">${gLogo} Continue with Google <span class="label-chip">Demo</span></button><div class="rule" style="margin:6px 0"></div><div class="eyebrow">MANAGEMENT / HR / PAYROLL</div><button class="login-provider microsoft-provider" data-action="login-manager">${mLogo} Continue with Microsoft 365 <span class="label-chip">Demo</span></button></div><div class="notice"><strong>Preview mode:</strong> Google opens staff ordering; Microsoft opens the management and payroll preview. Neither button connects to a real account or processes a payment.</div></div></div>`}
const navItems=[['order','New order'],['history','My orders'],['manage','Management'],['payroll','Payroll / HR'],['terms','Terms & wording'],['guide','Review guide']];
function pageLayout(title,subtitle,content){let showNav=navItems.filter(([id])=>state.profile.role==='staff'?['order','history','terms','guide'].includes(id):true);return `${header()}${demoNotice()}<div class="layout"><aside class="sidebar"><div class="eyebrow">${state.profile.role==='staff'?'Staff portal':'Management portal'}</div><div class="nav">${showNav.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}"><span style="font-size:18px;min-width:20px;text-align:center">${icon(id)}</span>${label}</button>`).join('')}</div><div class="side-note"><strong>Preview controls</strong><p>Use Sign out to switch between the staff Google preview and the management Microsoft preview.</p></div></aside><main class="main"><div class="eyebrow">TOC / ${state.profile.role==='staff'?'Staff':'Administration'}</div><h1>${title}</h1><p class="lead">${subtitle}</p><div class="stack">${content}</div><div class="footer">Tasmanian Oyster Company · Demonstration preview only · Not a live ordering or payroll system</div></main></div>`}
function orderPage(){const rows=cart.map((r,i)=>`<tr><td>${esc(r.farm)}</td><td>${esc(r.product)} <div class="hint">Per ${esc(r.unit)}</div></td><td>${r.qty}</td><td class="right money">${money(r.price*r.qty)}</td><td class="right"><button class="button alt small" data-remove="${i}">Remove</button></td></tr>`).join('');const total=cart.reduce((s,r)=>s+r.qty*r.price,0);return pageLayout('Order oysters','Choose a supplying farm, review your order and give a separate authorisation for the exact proposed wage deduction.',`<section class="card"><div class="row space"><h2 class="section-title">1. Select oysters</h2><span class="pill blue">Buffet · $6 per dozen</span></div><div class="grid three"><div class="field"><label for="farm">Supplying farm</label><select id="farm"><option>Smithton</option><option>Pittwater</option><option>Boomer Bay</option></select></div><div class="field"><label for="product">Product / size</label><select id="product">${state.prices.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} – ${money(r.price)} / ${esc(r.unit)}</option>`).join('')}</select></div><div class="field"><label for="qty">Quantity (dozens)</label><input id="qty" type="number" min="1" max="1000" step="1" value="1"></div></div><div class="form-actions" style="margin-top:15px"><button class="button" data-action="add-cart">+ Add to order</button></div><div class="rule"></div><h3 class="section-title">Order summary</h3>${cart.length?`<div class="table-wrap"><table><thead><tr><th>Farm</th><th>Oysters</th><th>Qty</th><th class="right">Subtotal</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Your order is empty. Add oysters from one or more farms above.</div>`}<div class="row space" style="margin-top:16px"><span class="muted">No charge is made in this preview.</span><div class="total money">${money(total)}</div></div></section><section class="card"><h2 class="section-title">2. Staff & collection details</h2><div class="grid"><div class="field"><label for="staff-name">Employee full name</label><input id="staff-name" autocomplete="name" placeholder="e.g. Alex Sample" value="${esc(formCache.staff||'')}"></div><div class="field"><label for="staff-id">Employee number (optional)</label><input id="staff-id" placeholder="TOC employee number" value="${esc(formCache.staffId||'')}"></div><div class="field"><label for="staff-email">Employee email</label><input id="staff-email" type="email" placeholder="name@example.com" value="${esc(formCache.email||'')}"></div><div class="field"><label for="pickup">Preferred collection date</label><input id="pickup" type="date" min="${tomorrow().slice(0,10)}" value="${esc(formCache.pickup||tomorrow())}"></div></div><div class="field" style="margin-top:15px"><label for="pickup-notes">Collection instructions / notes (optional)</label><textarea id="pickup-notes" placeholder="Any details management needs to know">${esc(formCache.pickupNotes||'')}</textarea></div><p class="hint">Collection date is a request only; management will confirm the location, availability and timing.</p></section><section class="card"><h2 class="section-title">3. Wage deduction authorisation</h2><div class="summary-box"><div class="eyebrow">Proposed deduction amount for this order</div><div class="total money" id="consent-total">${money(total)}</div><div class="hint">No deduction will be processed through this preview.</div></div><div class="auth-line"><strong>Important:</strong> Written authorisation must be reviewed by TOC Payroll/HR under applicable Australian employment law and TOC policy. This preview does not establish legal compliance.</div><details class="accordion"><summary>Read draft terms & conditions</summary><div class="guide" style="white-space:pre-wrap">${esc(state.terms)}</div></details><label class="checkrow"><input id="consent" type="checkbox"><span>I voluntarily authorise TOC to consider the <strong>exact total shown above</strong> as a wage deduction for this order, subject to payroll approval and the terms displayed. I understand this is a draft process.</span></label><div class="grid"><div class="field"><label for="signature">Type full name as authorisation</label><input id="signature" placeholder="Full name"></div><div class="field"><label for="signed-date">Date of authorisation</label><input id="signed-date" value="${date(new Date().toISOString())}" disabled></div></div><div class="form-actions" style="margin-top:20px"><button class="button" data-action="submit-order">Submit sample order</button></div></section>`)}
function historyPage(){const orders=state.orders.filter(o=>state.profile.role!=='staff'||o.staff==='Demo Employee'||o.staff===formCache.staff||o.email===formCache.email);return pageLayout('My orders','Review sample order history and the status of any orders created in this browser.',`<div class="card"><div class="row space"><h2 class="section-title">Orders</h2><button class="button alt small" data-view="order">+ New order</button></div>${orders.length?`<div class="order-cards">${orders.slice().reverse().map(o=>`<article class="order-card"><div class="status-row"><div><strong>${esc(o.id)}</strong><div class="muted">Placed ${date(o.created)} · Preferred pickup ${date(o.pickup)}</div></div>${statusPill(o.status)}</div><div style="margin-top:11px">${o.items.map(r=>`<div>${esc(r.farm)} · ${esc(r.product)} · ${r.qty} ${esc(r.unit)}(s)</div>`).join('')}</div><div class="row space" style="margin-top:12px"><strong class="money">${money(o.total)}</strong><button class="button alt small" data-details="${esc(o.id)}">View order</button></div></article>`).join('')}</div>`:'<div class="empty">No orders yet.</div>'}</div>`)}
function managePage(){if(state.profile.role==='staff')return historyPage();const counts={Submitted:state.orders.filter(x=>x.status==='Submitted').length,Approved:state.orders.filter(x=>x.status==='Approved').length,Ready:state.orders.filter(x=>x.status==='Ready').length};return pageLayout('Order management','Review submitted orders, update their status, and verify collection. These controls operate on demo data only.',`<div class="grid three"><div class="metric"><div class="number">${counts.Submitted}</div><div class="caption">Awaiting review</div></div><div class="metric"><div class="number">${counts.Approved}</div><div class="caption">Approved</div></div><div class="metric"><div class="number">${counts.Ready}</div><div class="caption">Ready for collection</div></div></div><section class="card"><div class="row space"><h2 class="section-title">All orders</h2><div class="field"><label for="filter-orders">Filter by status</label><select id="filter-orders"><option value="All">All</option><option>Submitted</option><option>Approved</option><option>Ready</option><option>Collected</option><option>Declined</option></select></div></div><div id="manage-table">${manageTable('All')}</div></section><section class="card"><h2 class="section-title">Staff oyster pricing (demo)</h2><p class="muted">Staff oyster pricing is currently set to Buffet size oysters at $6 per dozen for all farms in this demo. Existing submitted orders retain their authorised prices unless you reset the preview.</p><div class="grid three">${state.prices.map(p=>`<div class="field"><label for="price-${esc(p.id)}">${esc(p.name)} ($ / dozen)</label><input type="number" min="0" step="0.01" id="price-${esc(p.id)}" value="${Number(p.price)}"></div>`).join('')}</div><div class="form-actions" style="margin-top:17px"><button class="button alt" data-action="save-prices">Save sample prices</button></div></section>`)}
function manageTable(f){let orders=state.orders.filter(o=>f==='All'||o.status===f);return orders.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Employee</th><th>Farm(s)</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${orders.slice().reverse().map(o=>`<tr><td><strong>${esc(o.id)}</strong><div class="hint">${date(o.created)}</div></td><td>${esc(o.staff)}</td><td>${esc([...new Set(o.items.map(i=>i.farm))].join(', '))}</td><td class="money">${money(o.total)}</td><td>${statusPill(o.status)}</td><td><button class="button alt small" data-details="${esc(o.id)}">Review</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders match this filter.</div>'}
function payrollPage(){if(state.profile.role==='staff')return historyPage();let eligible=state.orders.filter(o=>['Approved','Ready','Collected'].includes(o.status));const pending=eligible.filter(o=>o.payroll!=='Processed');return pageLayout('Payroll & HR','Review per-order written authorisation and export sample deductions. Only approved orders are eligible.',`<div class="grid three"><div class="metric"><div class="number">${pending.length}</div><div class="caption">Approved / unprocessed orders</div></div><div class="metric"><div class="number money">${money(pending.reduce((s,x)=>s+x.total,0))}</div><div class="caption">Proposed deductions</div></div><div class="metric"><div class="number">${eligible.filter(o=>o.payroll==='Processed').length}</div><div class="caption">Marked processed (demo)</div></div></div><section class="card"><div class="row space"><h2 class="section-title">Approved order deductions</h2><button class="button alt small" data-action="export-payroll">Export sample CSV</button></div><div class="auth-line">A CSV is not an instruction to deduct wages. Payroll must independently verify the original authorisation, amount, applicable industrial instruments and legality before any real processing.</div>${eligible.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Staff</th><th>Signed</th><th>Amount</th><th>Payroll</th><th></th></tr></thead><tbody>${eligible.slice().reverse().map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.staff)}<div class="hint">${esc(o.staffId||'No staff ID')}</div></td><td>${date(o.agreedAt)}<div class="hint">${esc(o.signature)}</div></td><td class="money">${money(o.total)}</td><td>${statusPill(o.payroll||'Pending')}</td><td><button class="button alt small" data-details="${esc(o.id)}">View</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No approved orders available for payroll review.</div>'}</section><section class="card"><h2 class="section-title">Notification recipients — draft</h2><div class="field"><label for="inboxes">Order email recipient list (preview only)</label><textarea id="inboxes" rows="3">${esc(state.inboxes)}</textarea></div><p class="hint">These are placeholders. No email is sent. Your IT provider must configure Microsoft Graph or an approved mail service and real destination inboxes.</p><div class="form-actions"><button class="button alt" data-action="save-inboxes">Save draft recipients</button></div></section>`)}
function termsPage(){return pageLayout('Terms & wording','Proofread the proposed staff wording and record any changes you want made before IT deployment.',`<section class="card"><div class="row space"><h2 class="section-title">Draft ordering terms</h2><span class="pill amber">Not legally approved</span></div><p class="muted">The wording below is a starting point only. TOC HR/payroll and legal advisers should approve it before orders or deductions go live.</p><div class="field"><label for="terms-text">Editable draft</label><textarea id="terms-text" style="min-height:310px">${esc(state.terms)}</textarea></div><div class="form-actions" style="margin-top:12px"><button class="button alt" data-action="save-terms">Save wording in browser</button></div></section><section class="card"><h2 class="section-title">Your proofreading notes</h2><div class="field"><label for="review-notes">Record spelling, product, pricing, workflow, or policy changes</label><textarea id="review-notes" style="min-height:190px" placeholder="Example: Replace 'Preferred collection date' with 'Requested pickup day'.\nAdd a product size.\nUse a different consent clause.">${esc(state.notes||'')}</textarea></div><div class="form-actions" style="margin-top:12px"><button class="button alt" data-action="save-notes">Save notes</button><button class="button" data-action="export-notes">Download review notes (.txt)</button></div></section>`)}
function guidePage(){return pageLayout('Review guide','A checklist of the screens and functionality to approve before the IT provider publishes a production app.',`<section class="card"><h2 class="section-title">What you can test today</h2><div class="guide">✓ Staff Google-style sign-in preview (simulated)</div><div class="guide">✓ Farm selection: Smithton, Pittwater and Boomer Bay</div><div class="guide">✓ Add multiple products or farms to one order</div><div class="guide">✓ Staff details, requested collection date and order history</div><div class="guide">✓ Separate order-specific wage deduction consent</div><div class="guide">✓ Management review, approval and collection tracking</div><div class="guide">✓ Payroll authorisation review and CSV download</div><div class="guide">✓ Buffet size staff oysters set at $6 per dozen across all farms</div><div class="guide">✓ Proofreading notes that can be exported</div><div class="rule"></div><h2 class="section-title">Not connected yet</h2><p class="muted">Real Google OAuth and Microsoft Entra ID authentication; Azure hosting; user approvals; database; secure role-based access; Microsoft Outlook notifications; HR-approved terms; actual stock, products, prices and payroll integration; QR code to the production URL.</p></section><section class="card"><div class="row space"><div><h2 class="section-title">Start again</h2><div class="muted">Resets all local demo orders, notes and example prices in this browser.</div></div><button class="button danger" data-action="reset">Reset preview</button></div></section>`)}
function render(){if(!state.profile){view='login';el('app').innerHTML=login();return}if(view==='login')view=state.profile.role==='staff'?'order':'manage';const pages={order:orderPage,history:historyPage,manage:managePage,payroll:payrollPage,terms:termsPage,guide:guidePage};if(state.profile.role==='staff'&&['manage','payroll'].includes(view))view='order';el('app').innerHTML=(pages[view]||orderPage)()}
function captureForm(){['staff-name','staff-id','staff-email','pickup','pickup-notes'].forEach((k)=>{if(el(k)){formCache[({'staff-name':'staff','staff-id':'staffId','staff-email':'email','pickup':'pickup','pickup-notes':'pickupNotes'})[k]]=el(k).value}})}
function confirmAction(message){return window.confirm(message)}
function openModal(o){selectedOrder=o.id;let allowed=state.profile.role==='manager';let lines=o.items.map(i=>`<tr><td>${esc(i.farm)}</td><td>${esc(i.product)}</td><td>${i.qty}</td><td class="right">${money(i.qty*i.price)}</td></tr>`).join('');let actions=allowed?`<div class="row" style="margin-top:16px">${o.status==='Submitted'?`<button class="button" data-update="Approved">Approve order</button><button class="button danger" data-update="Declined">Decline</button>`:''}${o.status==='Approved'?`<button class="button" data-update="Ready">Mark ready</button>`:''}${o.status==='Ready'?`<button class="button" data-update="Collected">Mark collected</button>`:''}${['Approved','Ready','Collected'].includes(o.status)&&o.payroll!=='Processed'?`<button class="button alt" data-payroll="Processed">Mark payroll processed (demo)</button>`:''}</div>`:'';el('modalRoot').innerHTML=`<div class="modal-backdrop" data-dismiss="1"><div class="modal" role="dialog" aria-modal="true" aria-label="Order details"><button class="close" data-action="close-modal" aria-label="Close order details">✕</button><div class="eyebrow">Order details</div><h2 style="color:var(--deep);margin:6px 0">${esc(o.id)} ${statusPill(o.status)}</h2><p class="muted">${esc(o.staff)} · ${esc(o.email)}<br>Submitted ${time(o.created)}<br>Preferred collection ${date(o.pickup)}</p><div class="table-wrap"><table><thead><tr><th>Farm</th><th>Product</th><th>Qty</th><th class="right">Subtotal</th></tr></thead><tbody>${lines}</tbody></table></div><div class="row space" style="margin:12px 0"><strong>Total authorised</strong><strong class="total money">${money(o.total)}</strong></div><div class="auth-line"><strong>Consent recorded (demo)</strong><br>Typed signature: ${esc(o.signature)}<br>Timestamp: ${time(o.agreedAt)}<br><small>Draft terms were stored with the order; this is not an enforceable digital-signature system.</small></div><details><summary>Terms displayed when order was submitted</summary><p class="guide" style="white-space:pre-wrap">${esc(o.termSnapshot||DEFAULT_TERMS)}</p></details><p class="muted">Collection notes: ${esc(o.pickupNotes||'None')}<br>Manager notes: ${esc(o.managerNote||'None')}</p>${actions}</div></div>`}
function closeModal(){el('modalRoot').innerHTML='';selectedOrder=null}
function updateOrder(status){let o=state.orders.find(o=>o.id===selectedOrder);if(!o)return;const valid={Submitted:['Approved','Declined'],Approved:['Ready'],Ready:['Collected']};if(!((valid[o.status]||[]).includes(status)))return toast('This status change is not permitted.');if(status==='Declined')o.managerNote=prompt('Reason for declining the order (optional):','')||'';o.status=status;if(status==='Approved')o.payroll='Pending';save();closeModal();render();toast(`Sample order ${o.id} updated to ${status}. No email has been sent.`)}
function exportText(text,filename,type){const blob=new Blob([text],{type});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(href),1000)}
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function doAction(a){if(a==='login-staff'||a==='login-manager'){const role=a==='login-staff'?'staff':'manager';state.profile={role,email:role==='staff'?'demo.staff@example.com':'demo.manager@example.com'};view=role==='staff'?'order':'manage';save();render();toast('You are viewing a simulated login, not a real account session.');return}if(a==='logout'){state.profile=null;view='login';save();render();return}if(a==='close-modal'){closeModal();return}if(a==='add-cart'){const p=state.prices.find(p=>p.id===el('product').value);const farm=el('farm').value;const qty=Number(el('qty').value);if(!p||!Number.isInteger(qty)||qty<1||qty>1000){toast('Enter a whole-number quantity from 1 to 1000.');return}captureForm();let item=cart.find(r=>r.farm===farm&&r.product===p.name&&r.price===p.price);if(item)item.qty+=qty;else cart.push({farm,product:p.name,unit:p.unit,qty,price:Number(p.price)});render();toast('Item added to sample order.');return}if(a==='submit-order'){captureForm();let total=cart.reduce((s,x)=>s+x.qty*x.price,0);let name=formCache.staff?.trim(),email=formCache.email?.trim(),sig=el('signature')?.value.trim(),termsAgreed=el('consent')?.checked;if(!cart.length)return toast('Add at least one product to the order.');if(!name||!email||!/^\S+@\S+\.\S+$/.test(email)||!formCache.pickup)return toast('Complete name, valid email and collection date.');if(!termsAgreed||!sig||sig.toLowerCase()!==name.toLowerCase())return toast('Review and accept the authorisation, then type the same full name as the employee.');if(!confirmAction(`Submit this DEMO order for ${money(total)}? No real order, email or payroll deduction will be created.`))return;let id='DEMO-'+Math.floor(1000+Math.random()*9000)+'-'+String(Date.now()).slice(-4);let o={id,staff:name,email,staffId:formCache.staffId||'',created:now(),pickup:formCache.pickup,pickupNotes:formCache.pickupNotes||'',items:cart.map(x=>({...x})),total,signature:sig,agreedAt:now(),termSnapshot:state.terms,status:'Submitted',payroll:'Not ready',managerNote:''};state.orders.push(o);save();cart=[];view='history';render();toast(`Sample order ${id} submitted locally. No email was sent.`);return}if(a==='save-prices'){for(let p of state.prices){let n=Number(el('price-'+p.id)?.value);if(!Number.isFinite(n)||n<0||n>10000)return toast('Enter valid non-negative prices.');p.price=Math.round(n*100)/100}save();render();toast('Sample prices saved in this browser.');return}if(a==='save-terms'){state.terms=el('terms-text').value;save();toast('Draft terms saved in this browser.');return}if(a==='save-notes'){state.notes=el('review-notes').value;save();toast('Proofreading notes saved.');return}if(a==='export-notes'){if(el('review-notes'))state.notes=el('review-notes').value;if(el('terms-text'))state.terms=el('terms-text').value;save();exportText('TOC Staff Oyster Orders – Proofreading Notes\n\n'+(state.notes||'(No notes entered)')+'\n\nDRAFT TERMS & CONDITIONS\n\n'+state.terms,'TOC_Oyster_Orders_Review_Notes.txt','text/plain;charset=utf-8');toast('Review notes file created.');return}if(a==='save-inboxes'){state.inboxes=el('inboxes').value;save();toast('Draft inboxes saved. No notifications have been sent.');return}if(a==='export-payroll'){const eligible=state.orders.filter(o=>['Approved','Ready','Collected'].includes(o.status));const rows=[['ORDER_ID','EMPLOYEE_NAME','EMPLOYEE_NUMBER','EMPLOYEE_EMAIL','ORDER_AMOUNT_AUD','AUTHORISED_BY_TYPED_NAME','AUTHORISATION_TIMESTAMP','ORDER_STATUS','DEMO_PAYROLL_STATUS','PREVIEW_NOT_REAL'],...eligible.map(o=>[o.id,o.staff,o.staffId,o.email,Number(o.total).toFixed(2),o.signature,o.agreedAt,o.status,o.payroll,'DEMO ONLY - DO NOT PAYROLL'])];exportText('\ufeff'+rows.map(row=>row.map(csv).join(',')).join('\r\n'),'TOC_DEMO_Payroll_Export_DO_NOT_PROCESS.csv','text/csv;charset=utf-8');toast('Demo CSV downloaded — do not import into live payroll.');return}if(a==='reset'){if(!confirmAction('Erase all demo changes and restore example orders, prices and notes?'))return;state=standardData();cart=[];formCache={};view='login';save();render();toast('Demo reset.');return}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-view],[data-remove],[data-details],[data-update],[data-payroll],[data-dismiss]');if(!target)return;if(target.dataset.view){if(view==='order')captureForm();view=target.dataset.view;render();window.scrollTo(0,0);return}if(target.dataset.remove!==undefined){captureForm();cart.splice(Number(target.dataset.remove),1);render();return}if(target.dataset.details){let o=state.orders.find(o=>o.id===target.dataset.details);if(o)openModal(o);return}if(target.dataset.update){updateOrder(target.dataset.update);return}if(target.dataset.payroll){let o=state.orders.find(o=>o.id===selectedOrder);if(o&&['Approved','Ready','Collected'].includes(o.status)){o.payroll='Processed';save();closeModal();render();toast('Marked processed in preview only — no payroll action occurred.')}return}if(target.dataset.dismiss&&e.target===target){closeModal();return}if(target.dataset.action)doAction(target.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='filter-orders')el('manage-table').innerHTML=manageTable(e.target.value)});
save();render();
})();
</script>
</body>
</html>
