name: Update Duck River Flow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Duck River from the NRE map marker
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import datetime, json, re, time
          from zoneinfo import ZoneInfo
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select

          MAP_URL="https://portal.wrt.tas.gov.au/Data/Map"
          HOBART=ZoneInfo("Australia/Hobart")

          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          o.add_argument("--window-size=1920,1080")
          d=webdriver.Chrome(options=o)

          def body():
              try: return d.find_element(By.TAG_NAME,"body").text
              except Exception: return ""

          try:
              d.get(MAP_URL)
              time.sleep(8)
              try:
                  a=d.find_element(By.XPATH,"//button[normalize-space()='Accept'] | //a[normalize-space()='Accept'] | //*[@value='Accept']")
                  d.execute_script("arguments[0].click();",a)
                  time.sleep(8)
              except Exception:
                  pass

              d.get(MAP_URL)
              time.sleep(12)

              # Select the Discharge parameter wherever the portal exposes its selector.
              for s in d.find_elements(By.TAG_NAME,"select"):
                  try:
                      opts=[x.text.strip() for x in Select(s).options]
                      hit=next((x for x in opts if x.lower()=="discharge" or "discharge" in x.lower()),None)
                      if hit:
                          Select(s).select_by_visible_text(hit)
                          time.sleep(10)
                          break
                  except Exception:
                      pass

              # Find the Scotchtown / station 14214 marker or result and click it.
              clicked=False
              for xpath in [
                  "//*[contains(normalize-space(.),'14214') and contains(normalize-space(.),'Duck River')]",
                  "//*[contains(normalize-space(.),'14214')]",
                  "//*[contains(normalize-space(.),'Scotchtown')]",
                  "//*[contains(normalize-space(.),'Duck River')]"
              ]:
                  for e in d.find_elements(By.XPATH,xpath):
                      try:
                          if e.is_displayed():
                              d.execute_script("arguments[0].scrollIntoView({block:'center'});",e)
                              d.execute_script("arguments[0].click();",e)
                              time.sleep(5)
                              clicked=True
                              break
                      except Exception:
                          pass
                  if clicked: break

              # Some map markers are SVG/canvas-backed. Click the page near a matching
              # text element if the normal DOM click did not open the popup.
              text=body()
              print(text[:20000])

              # Only accept a value that is explicitly tied to the Scotchtown station
              # popup and expressed in ML/day. Never take an arbitrary ML/day value.
              lower=text.lower()
              station_pos=max(lower.find("14214"),lower.find("scotchtown"))
              if station_pos < 0:
                  raise RuntimeError("Scotchtown station 14214 not found on NRE map")

              context=text[max(0,station_pos-1000):station_pos+3000]
              patterns=[
                  r"(?:Latest Value|Latest Discharge|Discharge)[^0-9]{0,120}([0-9]+(?:\.[0-9]+)?)\s*(?:ML\s*/?\s*day|ML/day)",
                  r"([0-9]+(?:\.[0-9]+)?)\s*(?:ML\s*/?\s*day|ML/day)"
              ]
              vals=[]
              for p in patterns:
                  vals += re.findall(p,context,re.I)

              if not vals:
                  raise RuntimeError("Scotchtown popup has no ML/day Latest Value")

              ml_day=float(vals[0])
              if not (0 < ml_day < 100000):
                  raise RuntimeError("Invalid Scotchtown ML/day value")

              flow=ml_day/86.4
              if not (0 < flow < 200):
                  raise RuntimeError("Invalid converted Scotchtown flow")

              now=datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
              out={
                  "station":"Duck River US Scotchtown Road Bridge",
                  "station_no":"14214",
                  "flow":round(flow,3),
                  "ml_day":round(ml_day,3),
                  "timestamp":now.isoformat(),
                  "updated":now.isoformat(),
                  "limit":5,
                  "source":"NRE Tasmania Water Information Portal — Scotchtown map Latest Value",
                  "source_url":"https://portal.wrt.tas.gov.au/Data/Map"
              }
              with open("river.json","w",encoding="utf-8") as f:
                  json.dump(out,f,separators=(",",":"))
              print("VERIFIED SCOTCHTOWN MAP READING:",json.dumps(out))
          except Exception as exc:
              print("River update did not obtain a verified Scotchtown map reading:",exc)
              # Leave river.json unchanged when the map value cannot be tied to station 14214.
          finally:
              d.quit()

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
