name: Update Duck River Flow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Duck River from NRE live map network data
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import datetime, json, re, time
          from zoneinfo import ZoneInfo
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          MAP_URL="https://portal.wrt.tas.gov.au/Data/Map"
          HOBART=ZoneInfo("Australia/Hobart")

          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          o.add_argument("--window-size=1920,1080")
          o.add_argument("--disable-gpu")
          o.set_capability("goog:loggingPrefs", {"performance":"ALL"})
          d=webdriver.Chrome(options=o)

          def find_ml_station(text):
              if not text: return None
              low=text.lower()
              if "14214" not in low and "scotchtown" not in low and "duck river" not in low:
                  return None
              patterns=[
                  r"(?:latest value|latest discharge|discharge|value)[^0-9]{0,250}([0-9]+(?:\.[0-9]+)?)\s*(?:ml\s*/?\s*day|mld)",
                  r"([0-9]+(?:\.[0-9]+)?)\s*(?:ml\s*/?\s*day|mld)"
              ]
              for p in patterns:
                  for m in re.finditer(p,text,re.I|re.S):
                      v=float(m.group(1))
                      if 0 < v < 100000:
                          return v
              return None

          try:
              d.execute_cdp_cmd("Network.enable", {})
              d.get(MAP_URL)
              time.sleep(8)
              try:
                  a=d.find_element("xpath","//button[normalize-space()='Accept'] | //a[normalize-space()='Accept'] | //*[@value='Accept']")
                  d.execute_script("arguments[0].click();",a)
                  time.sleep(8)
              except Exception:
                  pass
              d.get(MAP_URL)
              time.sleep(18)

              # The visible portal defaults to Flow / Latest Value (ML/day).
              # Capture all XHR/fetch responses because the map itself is canvas/SVG
              # rendered and the station markers are not reliable DOM elements.
              bodies=[]
              for entry in d.get_log("performance"):
                  try:
                      msg=json.loads(entry["message"])["message"]
                      if msg["method"]=="Network.responseReceived":
                          p=msg["params"]; rid=p["requestId"]; resp=p["response"]
                          url=resp.get("url","")
                          ctype=(resp.get("mimeType") or "").lower()
                          if any(x in ctype for x in ("json","text","xml")):
                              try:
                                  body=d.execute_cdp_cmd("Network.getResponseBody",{"requestId":rid}).get("body","")
                                  if body:
                                      bodies.append((url,body))
                              except Exception:
                                  pass
                  except Exception:
                      pass

              # Also inspect the final rendered page text.
              try:
                  bodies.append(("rendered-page",d.find_element("tag name","body").text))
              except Exception:
                  pass

              candidates=[]
              for url,body in bodies:
                  ml=find_ml_station(body)
                  if ml is not None:
                      candidates.append((url,ml,body[:1000]))

              # Prefer a response explicitly identifying station 14214/Scotchtown.
              if not candidates:
                  raise RuntimeError("No NRE network response contained a Scotchtown/14214 ML/day value")

              # Require the candidate's surrounding text to contain the station identity.
              verified=[]
              for url,ml,sample in candidates:
                  if re.search(r"14214|Scotchtown|Duck River",sample,re.I):
                      verified.append((url,ml))
              if not verified:
                  raise RuntimeError("ML/day value found but not tied to station 14214")

              ml=max(verified,key=lambda x: len(x[0]))[1]
              flow=ml/86.4
              if not (0 < flow < 200):
                  raise RuntimeError("Invalid converted Scotchtown flow")

              previous_flow=None
              history=[]
              try:
                  with open("river.json","r",encoding="utf-8") as oldf:
                      old=json.load(oldf)
                      previous_flow=float(old.get("flow"))
                      history=list(old.get("history") or [])
              except Exception:
                  pass

              change_pct=None
              if previous_flow is not None and previous_flow != 0:
                  change_pct=round((flow-previous_flow)/previous_flow*100,1)

              now=datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
              point={"timestamp":now.isoformat(),"flow":round(flow,3),"ml_day":round(ml,3)}
              history.append(point)
              history=history[-72:]

              out={
                  "station":"Duck River US Scotchtown Road Bridge",
                  "station_no":"14214",
                  "flow":round(flow,3),
                  "ml_day":round(ml,3),
                  "timestamp":now.isoformat(),
                  "updated":now.isoformat(),
                  "limit":5,
                  "previous_flow":round(previous_flow,3) if previous_flow is not None else None,
                  "change_pct":change_pct,
                  "history":history,
                  "source":"NRE Tasmania Water Information Portal — station 14214 map Latest Value (ML/day)",
                  "source_url":MAP_URL
              }
              with open("river.json","w",encoding="utf-8") as f:
                  json.dump(out,f,separators=(",",":"))
              print("VERIFIED NRE SCOTCHTOWN READING:",json.dumps(out))
              print("SOURCE NETWORK URL:",verified[0][0])
          except Exception as exc:
              print("River update did not obtain a verified NRE Scotchtown reading:",exc)
              # Keep the last verified river.json unchanged.
          finally:
              d.quit()

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
