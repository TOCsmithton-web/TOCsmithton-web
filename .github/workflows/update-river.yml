name: Update Duck River Flow

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the live NRE Tasmania portal reading
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import datetime
          import json
          import re
          import time
          from zoneinfo import ZoneInfo
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL = "https://portal.wrt.tas.gov.au/Data/DataSet/Chart/Location/14214-1/DataSet/Discharge/1/Interval/Latest"
          HOBART = ZoneInfo("Australia/Hobart")

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-gpu")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(URL)
              # The portal now presents an acceptance page on a fresh runner.
              # Accept it once, then reload the requested live-data page.
              time.sleep(3)
              try:
                  accept = driver.find_element("xpath", "//button[normalize-space()='Accept'] | //a[normalize-space()='Accept'] | //*[@value='Accept']")
                  driver.execute_script("arguments[0].click();", accept)
                  time.sleep(4)
              except Exception:
                  pass
              # Retry the live page because the portal can be slow to initialise.
              text = ""
              for attempt in range(3):
                  driver.get(URL)
                  time.sleep(12 + attempt * 5)
                  try:
                      text = driver.find_element("tag name", "body").text
                  except Exception:
                      text = ""
                  if "Discharge" in text or "m³/s" in text or "cumecs" in text.lower():
                      break
                  time.sleep(3)
              print(text[:12000])

              # The live chart tooltip/current marker is rendered by JavaScript.
              # Match the discharge value displayed in m^3/s (cumecs).
              # The NRE map reports Duck River flow as ML/day.
              # Convert megalitres/day to cubic metres/second:
              # 1 ML = 1,000,000 L and 1 day = 86,400 s, so ML/day / 86.4 = m³/s.
              ml_patterns = [
                  r"([0-9]+(?:\.[0-9]+)?)\s*(?:ML|ML\/day|ML\s*\/\s*day)\b",
                  r"(?:Latest Value|Latest Discharge|Discharge)[^0-9]{0,100}([0-9]+(?:\.[0-9]+)?)\s*(?:ML|ML\/day|ML\s*\/\s*day)\b"
              ]
              ml_matches = []
              for p in ml_patterns:
                  ml_matches.extend(re.findall(p, text, flags=re.I))

              if not ml_matches:
                  print("LIVE PORTAL ML/day READING NOT AVAILABLE — retaining previous verified river.json")
                  raise RuntimeError("No ML/day reading found")

              ml_values = [float(x) for x in ml_matches if 0 < float(x) < 100000]
              if not ml_values:
                  raise RuntimeError("No valid ML/day value found")

              ml_day = ml_values[0]
              flow = ml_day / 86.4
              print(f"PORTAL FLOW: {ml_day} ML/day -> {flow:.3f} m³/s")

              now = datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
              out = {
                  "station": "Duck River US Scotchtown Road Bridge",
                  "station_no": "14214",
                  "flow": round(flow, 3),
                  "timestamp": now.isoformat(),
                  "updated": now.isoformat(),
                  "limit": 5,
                  "source": "NRE Tasmania Water Information Portal",
                  "source_url": URL
              }

              with open("river.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, separators=(",", ":"))

              print("LIVE RIVER DATA:", json.dumps(out))
          except Exception as exc:
              print("River update did not obtain a new verified reading:", exc)
              # Do not fail the scheduled workflow when the portal is unavailable.
              # The existing river.json remains the last verified reading.
          finally:
              driver.quit()
          PY

      - name: Diagnose NRE map page
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import time, json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          URL="https://portal.wrt.tas.gov.au/Data/Map"
          o=Options(); o.add_argument("--headless=new"); o.add_argument("--no-sandbox"); o.add_argument("--disable-dev-shm-usage"); o.add_argument("--window-size=1920,1080")
          d=webdriver.Chrome(options=o)
          try:
              d.get(URL); time.sleep(8)
              try:
                  a=d.find_element("xpath","//button[normalize-space()='Accept'] | //a[normalize-space()='Accept'] | //*[@value='Accept']")
                  d.execute_script("arguments[0].click();",a); time.sleep(8)
              except Exception: pass
              d.get(URL); time.sleep(15)
              inputs=[]
              for e in d.find_elements("css selector","input,select,textarea"):
                  inputs.append({"tag":e.tag_name,"type":e.get_attribute("type"),"name":e.get_attribute("name"),"id":e.get_attribute("id"),"placeholder":e.get_attribute("placeholder"),"aria":e.get_attribute("aria-label"),"value":e.get_attribute("value")})
              body=d.find_element("tag name","body").text
              with open("river-debug.txt","w",encoding="utf-8") as f: f.write(json.dumps({"url":d.current_url,"inputs":inputs,"body":body[:30000]},indent=2))
          finally: d.quit()
          PY

      - name: Commit river diagnostic
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river-debug.txt
          git diff --cached --quiet && exit 0
          git commit -m "Diagnose NRE river map"
          git push

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
