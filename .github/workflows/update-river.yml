name: Update Duck River Flow

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "river.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Duck River from NRE data export
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, datetime, io, json, re, requests
          from zoneinfo import ZoneInfo

          PORTAL="https://portal.wrt.tas.gov.au"
          MAP_URL=PORTAL+"/Data/Map"
          EXPORT_URL=PORTAL+"/Export/BulkExport"
          HOBART=ZoneInfo("Australia/Hobart")
          DATASET="Discharge.1@14214-1"

          s=requests.Session()
          s.headers.update({"User-Agent":"TOC Smithton River Monitor/1.0","Accept":"text/csv,text/plain,*/*"})

          # Establish the portal session/disclaimer cookie first.
          r=s.get(MAP_URL,timeout=30,allow_redirects=True)
          print("Portal session:",r.status_code,r.url)

          query={
              "Calendar":"CALENDARYEAR",
              "Interval":"PointsAsRecorded",
              "Step":"1",
              "ExportFormat":"csv",
              "TimeAligned":"True",
              "RoundData":"False",
              "DateRange":"Days7",
              "Datasets[0].DatasetName":DATASET,
              "IncludeGradeCodes":"True",
              "IncludeApprovalLevels":"True",
              "IncludeQualifiers":"True",
              "IncludeInterpolationTypes":"True"
          }

          r=s.get(EXPORT_URL,params=query,timeout=60)
          print("NRE export:",r.status_code,r.url)
          print("NRE export preview:",r.text[:1000].replace("\n"," | "))

          if r.status_code != 200:
              raise RuntimeError(f"NRE export HTTP {r.status_code}")

          text=r.text
          if "Discharge" not in text and "Timestamp" not in text:
              raise RuntimeError("NRE export did not return a discharge CSV")

          lines=text.splitlines()
          header_i=next((i for i,line in enumerate(lines) if line.startswith("Timestamp (")),None)
          if header_i is None:
              raise RuntimeError("Could not locate Timestamp header in NRE CSV")

          reader=csv.reader(lines[header_i:])
          rows=list(reader)
          if len(rows)<2:
              raise RuntimeError("NRE CSV contained no data rows")

          header=rows[0]
          data_rows=[row for row in rows[1:] if row and row[0].strip()]
          if not data_rows:
              raise RuntimeError("NRE CSV contained no timestamped points")

          # The NRE portal Discharge.1 dataset is the portal's live
          # discharge series in m³/s. Use it directly; do not substitute
          # the older Flow.MLD daily-volume series.
          value_col=1 if len(header)>1 else None
          if value_col is None:
              raise RuntimeError("NRE CSV has no value column")

          latest=None
          for row in data_rows:
              if len(row)<=value_col:
                  continue
              try:
                  ts=row[0].strip()
                  value=float(row[value_col])
              except Exception:
                  continue
              if value != value or not (0 <= value < 100000):
                  continue
              latest=(ts,value)

          if latest is None:
              raise RuntimeError("No valid discharge value in NRE CSV")

          ts,value=latest
          # Discharge.1 is m³/s. Store both units for the app.
          flow=round(value,3)
          ml_day=round(value*86.4,3)

          previous_flow=None
          history=[]
          old={}
          try:
              with open("river.json","r",encoding="utf-8") as f:
                  old=json.load(f)
              previous_flow=float(old.get("flow"))
              history=list(old.get("history") or [])
          except Exception:
              pass

          change_pct=None
          if previous_flow is not None and previous_flow != 0:
              change_pct=round((flow-previous_flow)/previous_flow*100,1)

          now=datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
          try:
              source_dt=datetime.datetime.fromisoformat(ts.replace("Z","+00:00"))
              if source_dt.tzinfo is None:
                  source_dt=source_dt.replace(tzinfo=HOBART)
              source_timestamp=source_dt.astimezone(HOBART).isoformat()
          except Exception as e:
              raise RuntimeError(f"Invalid NRE source timestamp: {ts!r}") from e

          # Avoid adding duplicate telemetry points.
          if not history or history[-1].get("timestamp") != source_timestamp or float(history[-1].get("flow",0)) != flow:
              history.append({"timestamp":source_timestamp,"flow":flow,"ml_day":round(flow*86.4,3)})
          # Keep every distinct portal reading for at least the last 3 days.
          # The portal may publish at different intervals, so use timestamps
          # rather than a fixed number of points.
          cutoff_dt=source_dt-datetime.timedelta(days=3)
          trimmed=[]
          for item in history:
              try:
                  item_dt=datetime.datetime.fromisoformat(str(item.get("timestamp")).replace("Z","+00:00"))
                  if item_dt.tzinfo is None:
                      item_dt=item_dt.replace(tzinfo=HOBART)
                  if item_dt.astimezone(HOBART) >= cutoff_dt.astimezone(HOBART):
                      trimmed.append(item)
              except Exception:
                  pass
          history=trimmed[-1000:]

          out={
              "station":"Duck River US Scotchtown Road Bridge",
              "station_no":"14214",
              "flow":flow,
              "ml_day":ml_day,
              "timestamp":source_timestamp,
              "updated":now.isoformat(),
              "limit":5,
              "previous_flow":round(previous_flow,3) if previous_flow is not None else None,
              "change_pct":change_pct,
              "history":history,
              "source":"NRE Tasmania Water Information Portal — station 14214 Discharge.1 export",
              "source_url":EXPORT_URL
          }
          with open("river.json","w",encoding="utf-8") as f:
              json.dump(out,f,separators=(",",":"))
          print("VERIFIED NRE SCOTCHTOWN READING:",json.dumps(out))
          PY

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
