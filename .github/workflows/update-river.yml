name: Update Duck River Flow

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Tasmania Water Information Portal flow
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,datetime
          url="https://portal.wrt.tas.gov.au/Data/DataSet/Chart/Location/14214-1/DataSet/Discharge/1/Interval/Latest"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TOCsmithton-web"})
          try:
              html=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
              text=re.sub(r"<[^>]+>"," ",html)
              text=re.sub(r"\\s+"," ",text)
              m=re.search(r"Latest_Flow.*?([0-9]+(?:\\.[0-9]+)?)\\s*\\(cumecs\\)",text,re.I)
              if not m:
                  m=re.search(r"([0-9]+(?:\\.[0-9]+)?)\\s*\\(cumecs\\)",text,re.I)
              if not m:
                  raise SystemExit("No cumecs value found in portal response")
              value=float(m.group(1))
              now=datetime.datetime.now(datetime.timezone.utc).astimezone(datetime.timezone(datetime.timedelta(hours=10)))
              out={"station":"Duck River US Scotchtown Road Bridge","station_no":"14214","flow":value,"timestamp":now.isoformat(),"updated":now.isoformat(),"limit":5.5,"source":"Tasmania Water Information Portal","source_url":url}
              with open("river.json","w") as f: json.dump(out,f,separators=(",",":"))
              print(json.dumps(out))
          except Exception as e:
              print("Portal update failed; retaining last river.json:",e)
          PY

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
