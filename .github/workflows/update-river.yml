name: Update Duck River Flow

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the live NRE Tasmania portal reading
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import datetime
          import json
          import re
          import time
          from zoneinfo import ZoneInfo
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL = "https://portal.wrt.tas.gov.au/Data/DataSet/Chart/Location/14214-1/DataSet/Discharge/1/Interval/Latest"
          HOBART = ZoneInfo("Australia/Hobart")

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-gpu")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(URL)
              # The portal now presents an acceptance page on a fresh runner.
              # Accept it once, then reload the requested live-data page.
              time.sleep(3)
              try:
                  accept = driver.find_element("xpath", "//button[normalize-space()='Accept'] | //a[normalize-space()='Accept'] | //*[@value='Accept']")
                  driver.execute_script("arguments[0].click();", accept)
                  time.sleep(4)
              except Exception:
                  pass
              # Retry the live page because the portal can be slow to initialise.
              text = ""
              for attempt in range(3):
                  driver.get(URL)
                  time.sleep(12 + attempt * 5)
                  try:
                      text = driver.find_element("tag name", "body").text
                  except Exception:
                      text = ""
                  if "Discharge" in text or "m³/s" in text or "cumecs" in text.lower():
                      break
                  time.sleep(3)
              print(text[:12000])

              # The live chart tooltip/current marker is rendered by JavaScript.
              # Match the discharge value displayed in m^3/s (cumecs).
              patterns = [
                  r"([0-9]+(?:\.[0-9]+)?)\s*m\s*\^?\s*3\s*/\s*s",
                  r"([0-9]+(?:\.[0-9]+)?)\s*m³\s*/\s*s",
                  r"([0-9]+(?:\.[0-9]+)?)\s*\(cumecs\)",
              ]
              matches = []
              for p in patterns:
                  matches.extend(re.findall(p, text, flags=re.I))

              if not matches:
                  print("LIVE PORTAL READING NOT AVAILABLE — retaining previous verified river.json")
                  raise RuntimeError("No live discharge value found")

              values = [float(x) for x in matches if 0 <= float(x) < 1000]
              if not values:
                  raise SystemExit("No valid discharge value found")

              # Prefer the first value from the explicit Discharge pattern.
              discharge_matches = re.findall(patterns[-1], text, flags=re.I)
              if discharge_matches:
                  flow = float(discharge_matches[0])
              else:
                  # Fall back to the first unit-labelled value rather than taking
                  # the maximum, which can accidentally select a chart-axis value.
                  flow = values[0]

              now = datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
              out = {
                  "station": "Duck River US Scotchtown Road Bridge",
                  "station_no": "14214",
                  "flow": round(flow, 3),
                  "timestamp": now.isoformat(),
                  "updated": now.isoformat(),
                  "limit": 5,
                  "source": "NRE Tasmania Water Information Portal",
                  "source_url": URL
              }

              with open("river.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, separators=(",", ":"))

              print("LIVE RIVER DATA:", json.dumps(out))
          except Exception as exc:
              print("River update did not obtain a new verified reading:", exc)
              # Do not fail the scheduled workflow when the portal is unavailable.
              # The existing river.json remains the last verified reading.
          finally:
              driver.quit()
          PY

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
