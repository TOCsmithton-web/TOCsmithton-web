name: Update Duck River Flow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Duck River from the NRE map marker
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import datetime, json, re, time
          from zoneinfo import ZoneInfo
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.action_chains import ActionChains

          MAP_URL="https://portal.wrt.tas.gov.au/Data/Map"
          HOBART=ZoneInfo("Australia/Hobart")

          o=Options()
          o.add_argument("--headless=new")
          o.add_argument("--no-sandbox")
          o.add_argument("--disable-dev-shm-usage")
          o.add_argument("--window-size=1920,1080")
          o.add_argument("--disable-gpu")
          d=webdriver.Chrome(options=o)

          def text():
              try: return d.find_element(By.TAG_NAME,"body").text
              except Exception: return ""

          def parse_popup(t):
              low=t.lower()
              if "14214" not in low and "scotchtown" not in low and "duck river" not in low:
                  return None
              # Require an ML/day value in the same popup/page text.
              patterns=[
                  r"(?:latest value|latest discharge|discharge)[^0-9]{0,160}([0-9]+(?:\.[0-9]+)?)\s*ml\s*/?\s*day",
                  r"([0-9]+(?:\.[0-9]+)?)\s*ml\s*/?\s*day"
              ]
              for p in patterns:
                  m=re.search(p,t,re.I|re.S)
                  if m:
                      v=float(m.group(1))
                      if 0 < v < 100000:
                          return v
              return None

          try:
              d.get(MAP_URL)
              time.sleep(8)
              try:
                  a=d.find_element(By.XPATH,"//button[normalize-space()='Accept'] | //a[normalize-space()='Accept'] | //*[@value='Accept']")
                  d.execute_script("arguments[0].click();",a)
                  time.sleep(8)
              except Exception:
                  pass
              d.get(MAP_URL)
              time.sleep(15)

              # The portal defaults to latest flow in ML/day. If a selector is
              # available, explicitly choose Discharge/Latest.
              for el in d.find_elements(By.XPATH,"//select"):
                  try:
                      opts=[o.text.strip() for o in el.find_elements(By.TAG_NAME,"option")]
                      hit=next((x for x in opts if x.lower()=="discharge" or "discharge" in x.lower()),None)
                      if hit:
                          d.execute_script("arguments[0].value=[...arguments[0].options].find(o=>o.text.trim()===arguments[1]).value; arguments[0].dispatchEvent(new Event('change',{bubbles:true}));",el,hit)
                          time.sleep(10)
                          break
                  except Exception:
                      pass

              # Try every map-marker-like DOM element. When a marker is clicked,
              # the portal opens a location popup. Accept a value only if that
              # popup identifies station 14214 / Scotchtown / Duck River.
              candidates=d.find_elements(By.XPATH,
                  "//*[contains(translate(@class,'MARKER','marker'),'marker') or "
                  "contains(translate(@class,'INDICATOR','indicator'),'indicator') or "
                  "self::circle]")
              print("MAP CANDIDATES:",len(candidates))

              seen=set()
              for i,el in enumerate(candidates):
                  try:
                      key=(el.tag_name,el.get_attribute("class"),el.get_attribute("aria-label"),el.get_attribute("title"))
                      if key in seen: continue
                      seen.add(key)
                      d.execute_script("arguments[0].scrollIntoView({block:'center'});",el)
                      d.execute_script("arguments[0].click();",el)
                      time.sleep(1.5)
                      t=text()
                      ml=parse_popup(t)
                      if ml is not None:
                          flow=ml/86.4
                          if not (0 < flow < 200):
                              raise RuntimeError("Invalid converted Scotchtown flow")
                          previous_flow=None
                          try:
                              with open("river.json","r",encoding="utf-8") as oldf:
                                  previous_flow=float(json.load(oldf).get("flow"))
                          except Exception:
                              pass
                          change_pct=None
                          if previous_flow is not None and previous_flow != 0:
                              change_pct=round((flow-previous_flow)/previous_flow*100,1)
                          now=datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
                          history=[]
                          try:
                              with open("river.json","r",encoding="utf-8") as oldf:
                                  old_data=json.load(oldf)
                                  history=list(old_data.get("history") or [])
                          except Exception:
                              history=[]
                          point={"timestamp":now.isoformat(),"flow":round(flow,3),"ml_day":round(ml,3)}
                          history.append(point)
                          # Keep the latest 72 readings (12 hours at a 10-minute cadence).
                          history=history[-72:]
                          out={
                              "station":"Duck River US Scotchtown Road Bridge",
                              "station_no":"14214",
                              "flow":round(flow,3),
                              "ml_day":round(ml,3),
                              "timestamp":now.isoformat(),
                              "updated":now.isoformat(),
                              "limit":5,
                              "previous_flow":round(previous_flow,3) if previous_flow is not None else None,
                              "change_pct":change_pct,
                              "history":history,
                              "source":"NRE Tasmania Water Information Portal — Scotchtown map Latest Value (ML/day)",
                              "source_url":MAP_URL
                          }
                          with open("river.json","w",encoding="utf-8") as f:
                              json.dump(out,f,separators=(",",":"))
                          print("VERIFIED SCOTCHTOWN MAP READING:",json.dumps(out))
                          break
                  except Exception:
                      continue
              else:
                  raise RuntimeError("Could not open a Scotchtown/14214 map popup containing an ML/day value")

          except Exception as exc:
              print("River update did not obtain a verified Scotchtown map reading:",exc)
              # Keep the last verified river.json unchanged.
          finally:
              d.quit()

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
