name: Update Duck River Flow

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-river:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the live NRE Tasmania portal reading
        shell: bash
        run: |
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import datetime
          import json
          import re
          import time
          from zoneinfo import ZoneInfo
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          URL = "https://portal.wrt.tas.gov.au/Data/DataSet/Chart/Location/14214-1/DataSet/Discharge/1/Interval/Latest"
          HOBART = ZoneInfo("Australia/Hobart")

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-gpu")

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(URL)
              # Allow the Aquarius chart/data controls to finish loading.
              time.sleep(12)
              text = driver.find_element("tag name", "body").text
              print(text[:12000])

              # The live chart tooltip/current marker is rendered by JavaScript.
              # Match the discharge value displayed in m^3/s (cumecs).
              patterns = [
                  r"([0-9]+(?:\.[0-9]+)?)\s*m\s*\^?\s*3\s*/\s*s",
                  r"([0-9]+(?:\.[0-9]+)?)\s*m³\s*/\s*s",
                  r"([0-9]+(?:\.[0-9]+)?)\s*\(cumecs\)",
              ]
              matches = []
              for p in patterns:
                  matches.extend(re.findall(p, text, flags=re.I))

              if not matches:
                  raise SystemExit("Could not find the live Duck River discharge value in the rendered NRE portal")

              # Prefer a value close to the chart's current reading. Remove obvious
              # axis values and retain the largest precision value when duplicates exist.
              values = [float(x) for x in matches if 0 <= float(x) < 1000]
              if not values:
                  raise SystemExit("No valid discharge value found")

              flow = max(values)

              now = datetime.datetime.now(datetime.timezone.utc).astimezone(HOBART)
              out = {
                  "station": "Duck River US Scotchtown Road Bridge",
                  "station_no": "14214",
                  "flow": round(flow, 3),
                  "timestamp": now.isoformat(),
                  "updated": now.isoformat(),
                  "limit": 5,
                  "source": "NRE Tasmania Water Information Portal",
                  "source_url": URL
              }

              with open("river.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, separators=(",", ":"))

              print("LIVE RIVER DATA:", json.dumps(out))
          finally:
              driver.quit()
          PY

      - name: Commit river data
        shell: bash
        run: |
          git config user.name "TOC Smithton Bot"
          git config user.email "actions@users.noreply.github.com"
          git add river.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Duck River flow data"
          git push
