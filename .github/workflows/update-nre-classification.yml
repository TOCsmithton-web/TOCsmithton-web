name: Update NRE Duck Bay Classification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-nre-classification.yml"
      - "scripts/extract-nre-classification.py"
      - "scripts/fetch-nre-classification.py"
      - "tests/test_nre_classification.py"
      - "tests/test_nre_collection.py"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: nre-classification
  cancel-in-progress: false

jobs:
  update-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate NRE notice collection
        run: |
          python -m pip install --disable-pip-version-check -q pypdf==6.10.0
          python3 -m unittest discover -s tests -p 'test_nre_*.py' -v

      - name: Discover and fetch a fresh NRE classification notice
        run: |
          python3 scripts/fetch-nre-classification.py

      - name: Commit changed classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nre-classification.json nre-current-classification.pdf
          if git diff --cached --quiet; then
            echo "No NRE classification change."
            exit 0
          fi
          git commit -m "Update NRE Duck Bay classification"
          git pull --rebase origin main
          git push
