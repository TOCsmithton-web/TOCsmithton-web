name: Update NRE Duck Bay Classification

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current NRE ShellMAP classification notice
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            "https://nre.tas.gov.au/SiteAssets/ShellMAP%20Current%20Harvest%20Status.pdf" \
            -o /tmp/shellmap-current.pdf
          python -m pip install --disable-pip-version-check -q pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          reader = PdfReader("/tmp/shellmap-current.pdf")
          text = "\n".join((page.extract_text() or "") for page in reader.pages)
          Path("/tmp/shellmap-current.txt").write_text(text, encoding="utf-8")
          PY

      - name: Extract Duck Bay status and notice number
        run: |
          python3 scripts/extract-nre-classification.py /tmp/shellmap-current.txt nre-classification.json

      - name: Commit changed classification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nre-classification.json
          if git diff --cached --quiet; then
            echo "No NRE classification change."
            exit 0
          fi
          git commit -m "Update NRE Duck Bay classification"
          git pull --rebase origin main
          git push
