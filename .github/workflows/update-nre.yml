name: Update NRE Classification\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: "17 */6 * * *"\n\njobs:\n  update:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/checkout@v4\n      - name: Fetch current NRE notice\n        run: |\n          python -m pip install --quiet pypdf requests\n          python - <<'PY'\n          import json,re,requests,datetime\n          from pypdf import PdfReader\n          url="https://nre.tas.gov.au/SiteAssets/ShellMAP%20Current%20Harvest%20Status.pdf"\n          data=requests.get(url,timeout=30).content\n          open("/tmp/nre.pdf","wb").write(data)\n          text="\\n".join((p.extract_text() or "") for p in PdfReader("/tmp/nre.pdf").pages)\n          m=re.search(r"Classification Notice No\\.?\\s*([0-9]{4}/[0-9]+)",text,re.I)\n          notice=m.group(1) if m else ""\n          i=text.lower().find("duck bay harvest area")\n          block=text[i:i+1200] if i>=0 else ""\n          open_=bool(re.search(r"\\bOPEN\\b",block,re.I))\n          om=re.search(r"OPEN FROM\\s*([0-9]{4}[^\\n]{0,80})",block,re.I)\n          open_from=om.group(1).strip() if om else ""\n          out={"notice_number":notice,"duck_bay_open":open_,"duck_bay_open_from":open_from,"checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"source":url}\n          open("nre.json","w").write(json.dumps(out,indent=2)+"\\n")\n          print(json.dumps(out))\n          PY\n      - name: Commit updated NRE status\n        run: |\n          git config user.name "TOC NRE Status Bot"\n          git config user.email "actions@github.com"\n          git add nre.json\n          git diff --cached --quiet || git commit -m "Auto-update NRE Duck Bay classification" && git push\n