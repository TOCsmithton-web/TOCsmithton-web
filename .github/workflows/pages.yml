name: Deploy TOC Smithton Control

on:
  workflow_run:
    workflows: ["Update Smithton Weather", "Update Duck River Flow", "Update NRE Duck Bay Classification"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create Supabase browser config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > supabase-config.js <<EOF
          window.TOC_SUPABASE_URL = "https://gyzxsugnlobxlvqjevhh.supabase.co";
          window.TOC_SUPABASE_PUBLISHABLE_KEY = "$SUPABASE_PUBLISHABLE_KEY";
          EOF

      # Force a fresh Pages artifact after control-page repairs.
      # Deployment nudge: 2026-10-06T21:20 AEST
      - name: Prepare Pages artifact
        run: |
          touch .nojekyll
          printf '%s\n' "${GITHUB_SHA}" > .pages-deployment-sha
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .pages-deployment-time

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
