name: Deploy TOC Smithton Control

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create Supabase browser config
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > supabase-config.js <<EOF
          window.TOC_SUPABASE_URL = "https://gyzxsugnlobxlvqjevhh.supabase.co";
          window.TOC_SUPABASE_PUBLISHABLE_KEY = "$SUPABASE_PUBLISHABLE_KEY";
          EOF

      # Force a fresh Pages artifact after control-page repairs.
      # Deployment trigger repair: ensure direct main-branch pushes publish the latest control pages.
      # Deployment nudge: 2026-10-06T21:20 AEST
      - name: Build Boomer Bay weather and tide forecast
        env:
          WORLDTIDES_API_KEY: ${{ secrets.WORLDTIDES_API_KEY }}
          PLANNER_AI_ENDPOINT: ${{ secrets.PLANNER_AI_ENDPOINT }}
          PLANNER_AI_API_KEY: ${{ secrets.PLANNER_AI_API_KEY }}
          PLANNER_AI_MODEL: ${{ secrets.PLANNER_AI_MODEL }}
        run: python3 scripts/build-boomer-planner.py

      - name: Prepare Pages artifact
        run: |
          touch .nojekyll
          printf '%s\n' "${GITHUB_SHA}" > .pages-deployment-sha
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .pages-deployment-time

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
