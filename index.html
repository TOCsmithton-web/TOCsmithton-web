<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>TOC Smithton Control</title></head>
<body><p>Opening latest TOC Smithton Control…</p>
<script>
(async function(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){return r.unregister();}));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(function(k){return caches.delete(k);}));
    }
  }catch(e){}
  location.replace("./control-live.html?v=202610061800");
})();
</script></body></html>
